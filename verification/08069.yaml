# Verification record: Larimer County, November 3, 2026 general election.
#
# Filled in by a PERSON, not by a script or an agent. The build fails until it is complete.
#
# How to check (one to two hours):
#  1. Open the compiled sample ballot (sample_ballot below) next to sources/co-2026-11-03/08069.yaml.
#  2. Walk the PDF top to bottom. Every contest and question must be in the YAML, in the same order,
#     with the same candidates in the same order, party labels and vote limits.
#     Items marked "statewide:" are statewide items; check them in statewide.yaml.
#  3. Count items per group in printed order and enter them under groups. Groups are:
#     federal, state, legislature, county,
#     judges, measures (everything under Ballot Measures, all of them).
#  4. For every measure, copy its text straight from the PDF (not from the YAML) into measures.
#     The build compares them word for word, which catches extraction mistakes.
#  5. Check choices and the jurisdiction names on 1A to 7F; the ballot prints them as column headers, so the extractor took them from each measure's text.
#  6. Fix anything wrong in 08069.yaml, then fill in checked_by and checked_at.
#  7. A second person checks at least 10 percent of items (7 or more) and fills in spot_check.
scope: "08069"
election_id: co-2026-11-03
sample_ballot:   # paste the URL of 2026ge-larimer-county-sample-ballot.pdf on larimer.gov (the site blocks scripts)
checked_by:
checked_at:
groups: []
measures: {}
spot_check: {skipped: "Pilot, no second checker available; testers report errors in sessions"}
publish_unverified: {by: "Bob Rose", reason: "Pilot: testers review real ballots while verification continues"}