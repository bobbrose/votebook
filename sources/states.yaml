# Election sites for ZIP codes outside Colorado (REQ-02, AC-03).
# Each links to the state's page on vote.gov, the U.S. government's official voter site,
# which links on to the state's own election office. Generated from the Census state list.
# vote.gov blocks automated checks, so a person must click through these before the pilot.

