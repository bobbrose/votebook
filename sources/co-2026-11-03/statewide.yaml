- id: amendment-83
  kind: measure
  group: measures
  district_id: null
  title: Amendment 83
  ballot_text:
    text: Shall there be an amendment to the Colorado Constitution creating a constitutional right to hunt, fish,
      and harvest fish and wildlife by traditional methods, including all species of fish and wildlife managed by
      the state except non-game species, endangered species, or any species that is illegal to hunt under federal
      law, and, in connection therewith, establishing hunting and fishing as the preferred means of managing fish
      and wildlife populations; and preserving the right of the state to regulate hunting, fishing, and wildlife
      management if necessary for sound scientific wildlife conservation and management, public safety, or to preserve
      the future of hunting and fishing opportunities for all species?
