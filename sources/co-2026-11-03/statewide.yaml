- id: proposition-134
  kind: measure
  group: measures
  district_id: null
  title: Proposition 134
  ballot_text:
    text: Shall there be a change to the Colorado Revised Statutes creating new law restricting participation in
      all K-12 and collegiate school sports based on the participant’s sex as determined by certain aspects of their
      biological reproductive system, and, in connection therewith, requiring a school, institution of higher education,
      or athletic association to designate each school or intramural athletic team or sport as male, female, or
      coeducational; only allowing participants to compete on the team or sport of their designated sex or to compete
      on a coeducational team; creating an exception to allow a female to participate on a male-designated team
      or sport if there is no female team available; prohibiting a government entity, licensing or accrediting organization,
      or athletic association from entertaining a complaint, opening an investigation, or taking other adverse action
      against a school for maintaining separate teams or sports for females; and providing the commissioner of education
      with the authority to enforce the proposed initiative for K-12 school districts?
    source: https://www.coloradosos.gov/pubs/elections/Initiatives/ballot/contacts/2026.html
