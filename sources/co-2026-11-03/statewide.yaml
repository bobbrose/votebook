    text: Shall there be a change to the Colorado Revised Statutes modifying existing law concerning human trafficking
      of a minor for sexual servitude, and, in connection therewith, creating new law expanding human trafficking
      of a minor for sexual servitude to include knowingly trading anything of monetary value to buy or sell sexual
      activity with a minor and increasing the penalty to be life in prison without parole or release?
