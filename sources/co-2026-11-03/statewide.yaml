- id: proposition-137
  kind: measure
  group: measures
  district_id: null
  title: Proposition 137
  ballot_text:
    text: Shall there be a change to the Colorado Revised Statutes creating new law to increase water and land conservation
      funding without raising taxes, and, in connection therewith, through a voter-approved revenue change, allowing
      the state to keep and spend a portion of revenue from the state sales tax on sporting goods and equipment
      to conserve and protect Colorado’s water, land, and forests, prevent wildfires, support outdoor recreation
      training and activities, and reduce revenue spent on these conservation purposes if necessary to preserve
      funding for certain tax credits?
