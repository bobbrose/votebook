- id: proposition-135
  kind: measure
  group: measures
  district_id: null
  title: Proposition 135
  ballot_text:
    text: Shall there be a change to the Colorado Revised Statutes modifying existing law by prohibiting surgery
      on a minor for the purpose of altering the minor’s biological sex characteristics, and, in connection therewith,
      prohibiting any health-care professional or other person from knowingly performing, prescribing, administering,
      or providing any surgery to a minor for the purpose of altering the minor’s biological sex characteristics
      and prohibiting the use of state or federal funds, Medicaid reimbursement, or insurance coverage to pay for
      this type of surgery?
