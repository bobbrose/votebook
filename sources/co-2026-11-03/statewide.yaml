  ballot_text:
    text: Shall state investment in K-12 public education increase two percent each year for the next ten years,
      with investments used to increase teacher pay, improve teacher retention, lower class sizes, and increase
      access to career and technical courses, without raising taxes but instead funded by raising the annual limit
      on state fiscal year spending only by the amount spent on public K-12 education as a voter-approved revenue
