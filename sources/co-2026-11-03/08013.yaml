- id: town-of-erie-3e
  kind: measure
  group: measures
  district_id: city-erie
  title: Town of Erie Ballot Issue 3E
  ballot_text:
    text: AUTHORIZATION FOR A NEW TOWN LODGING TAX FOR THE PURPOSES OF PAYING FOR PARK AND RECREATIONAL FACILITIES,
      CAPITAL INFRASTRUCTURE, LAW ENFORCEMENT/SAFETY AND SECURITY, AND FOR OTHER GENERAL GOVERNMENTAL PURPOSES SHALL
      THE TOWN OF ERIE TAXES BE INCREASED BY UP TO $150,000 COMMENCING ON JANUARY 1, 2027, AND BY WHATEVER AMOUNTS
      ARE GENERATED ANNUALLY THEREAFTER THROUGH THE IMPOSITION OF A LODGING TAX AT THE RATE OF THREE AND ONE HALF
      PERCENT ON THE TOTAL RENTAL FEE, PRICE, OR OTHER CONSIDERATION PAID OR CHARGED FOR THE LEASING OR RENTAL OF
      ANY HOTEL ROOM, MOTEL ROOM, BED AND BREAKFAST, SHORT TERM RENTAL OR OTHER ACCOMMODATION WITH A STAY OF THIRTY
      DAYS OR LESS, AND SHALL ALL REVENUES DERIVED FROM SUCH LODGING TAX BE USED FOR GENERAL GOVERNMENTAL PURPOSES,
      INCLUDING, BUT NOT LIMITED TO PARK AND RECREATIONAL FACILITIES, CAPITAL INFRASTRUCTURE, AND LAW ENFORCEMENT/SAFETY
      AND SECURITY PURPOSES, AND SHALL THE REVENUES FROM SUCH TAXES AND ANY EARNINGS FROM THE INVESTMENT OF SUCH
      REVENUES BE COLLECTED AND SPENT AS A VOTER-APPROVED REVENUE CHANGE PURSUANT TO ARTICLE X, SECTION 20 OF THE
      COLORADO CONSTITUTION AND ANY OTHER LAW?
    source: https://assets.bouldercounty.gov/wp-content/uploads/2026/09/Boulder-County-2026-General-Sample-Ballot.pdf
  provenance: *id001
- id: town-of-erie-3f
  kind: measure
  group: measures
  district_id: city-erie
  title: Town of Erie Ballot Issue 3F
  ballot_text:
    text: 'AUTHORIZATION FOR THE ISSUANCE OF DEBT AND AN ADDITIONAL SALES AND USE TAX FOR THE PURPOSE OF PAYING
      FOR THE EXPANSION OF THE ERIE COMMUNITY CENTER SHALL THE TOWN OF ERIE''S DEBT BE INCREASED BY UP TO $32.5
      MILLION, WITH A MAXIMUM REPAYMENT COST NOT TO EXCEED $52.6 MILLION (PRINCIPAL AND INTEREST) FOR THE PURPOSE
      OF UPDATING THE AGING ERIE COMMUNITY CENTER BUILDING AND FACILITIES BY ACQUIRING, DESIGNING, CONSTRUCTING,
      EXPANDING, RENOVATING, IMPROVING, AND EQUIPPING THE SAME AND FOR CONTINUED OPERATIONS AND MAINTENANCE, WITH
      SUCH IMPROVEMENTS TO INCLUDE BUT ARE NOT LIMITED TO: CONSTRUCTING AND EQUIPPING NEW FITNESS· STUDIOS AND EXPANDING
      EXISTING STUDIOS; CONSTRUCTING AND EQUIPPING A NEW GYMNASIUM· AND RACQUET BALL COURTS; EXPANDING MULTIPURPOSE
      COMMUNITY AND· RECREATION SPACE; EQUIPPING NEW STRENGTH TRAINING AND CIRCUIT· TRAINING AREAS; AND SHALL TOWN
      TAXES BE INCREASED BY UP TO $4,866,857 IN THE FIRST FULL FISCAL YEAR AND BY SUCH ADDITIONAL AMOUNTS AS ARE
      GENERATED ANNUALLY THEREAFTER BY AN INCREASE IN THE RATE OF SALES AND USE TAX IMPOSED BY THE TOWN BY .501%,
      COMMENCING JANUARY 1, 2027, WHICH TAX REVENUES WILL BE USED FOR THE PAYMENT OF THE DEBT AUTHORIZED BY THIS
      QUESTION AND FOR THE CONSTRUCTION, OPERATION AND MAINTENANCE OF THE ERIE COMMUNITY CENTER AND OTHER PARK AND
      RECREATION RELATED EXPENSES OF THE TOWN; AND MAY THE DEBT ISSUED PURSUANT TO THIS QUESTION BE PAID FROM SUCH
      LEGALLY AVAILABLE REVENUES, BEAR INTEREST, AND BE SOLD IN ONE SERIES OR MORE AT A PRICE ABOVE, BELOW OR EQUAL
      TO THE PRINCIPAL AMOUNT OF SUCH DEBT AND WITH SUCH TERMS AND CONDITIONS, INCLUDING PROVISIONS FOR REDEMPTION
      PRIOR TO MATURITY WITH OR WITHOUT PAYMENT OF PREMIUM OF NOT TO EXCEED 3%, ALL AS THE TOWN MAY DETERMINE; AND
      SHALL THE REVENUES RAISED BY SUCH SALES AND USE TAX RATE INCREASE AND PROCEEDS OF SUCH DEBT, ANY OTHER REVENUE
      USED TO PAY SUCH DEBT, AND INVESTMENT INCOME THEREON, BE COLLECTED AND SPENT BY THE TOWN AS A VOTER-APPROVED
      REVENUE CHANGE PURSUANT TO ARTICLE X, SECTION 20 OF THE COLORADO CONSTITUTION?'
    source: https://assets.bouldercounty.gov/wp-content/uploads/2026/09/Boulder-County-2026-General-Sample-Ballot.pdf
  provenance: *id001
