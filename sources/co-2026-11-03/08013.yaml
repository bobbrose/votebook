- id: boulder-county-1a
  kind: measure
  group: measures
  district_id: null
  title: Boulder County Ballot Issue 1A
  ballot_text:
    text: 'EARLY CHILDHOOD CARE AND EDUCATION MILL LEVY INCREASE AND VOTER-APPROVED REVENUE CHANGE SHALL BOULDER
      COUNTY TAXES BE INCREASED $30,000,000 ANNUALLY (IN TAX COLLECTION YEAR 2027), AND BY SUCH ADDITIONAL AMOUNTS
      RAISED ANNUALLY THEREAFTER, BY A MILL LEVY IMPOSED AT A RATE OF 2.579 MILLS (EQUATING TO APPROXIMATELY $115
      PER YEAR ON A $725,000 HOME BASED ON CURRENT RATES OF ASSESSMENT) FOR THE PURPOSE OF ADDRESSING THE SHORTAGE
      AND HIGH COST OF CHILD CARE AND PRESCHOOL PROGRAMS FOR BOULDER COUNTY FAMILIES WITH YOUNG CHILDREN, INCLUDING:
      LOWERING THE HIGH COST OF CHILD CARE AND· PRESCHOOL FOR BOULDER COUNTY FAMILIES; INCREASING THE COMPENSATION
      OF CHILD CARE AND· PRESCHOOL TEACHERS AND STAFF TO RETAIN AND ATTRACT HIGH-QUALITY EDUCATORS; AND ADDRESSING
      THE SHORTAGE OF CARE BY EXPANDING· CAPACITY FOR MORE CHILDREN AND REDUCING WAITLISTS; AND SHALL THE REVENUES
      AND EARNINGS ON THE INVESTMENT OF THE PROCEEDS OF SUCH TAX CONSTITUTE A VOTER-APPROVED REVENUE CHANGE UNDER
      ARTICLE X SECTION 20 OF THE COLORADO CONSTITUTION AND AN EXCEPTION TO THE LIMITATIONS SET FORTH IN SECTION
      29-1-301 OF THE COLORADO REVISED STATUTES, ALL AS MORE PARTICULARLY SET FORTH IN BOARD OF COUNTY COMMISSIONERS''
      RESOLUTION NO. 2026-048?'
    source: https://assets.bouldercounty.gov/wp-content/uploads/2026/09/Boulder-County-2026-General-Sample-Ballot.pdf
  provenance: *id001
- id: boulder-county-200
  kind: measure
  group: measures
  district_id: null
  title: Boulder County Ballot Question 200
  ballot_text:
    text: Shall the membership of the Boulder County Board of Commissioners be increased from a three member board
      to a five member board?
    source: https://assets.bouldercounty.gov/wp-content/uploads/2026/09/Boulder-County-2026-General-Sample-Ballot.pdf
  provenance: *id001
- id: boulder-county-201
  kind: measure
  group: measures
  district_id: null
  title: Boulder County Ballot Question 201
  ballot_text:
    text: If the membership of the Boulder County Board of Commissioners is increased from a three member board
      to a five member board, by what method shall the Boulder County Board of Commissioners be elected?
    source: https://assets.bouldercounty.gov/wp-content/uploads/2026/09/Boulder-County-2026-General-Sample-Ballot.pdf
  choices:
  - Five commissioners resident in districts to be elected only by voters resident in the district
  - Three commissioners resident in districts to be elected only by voters resident in the district; plus two commissioners
    resident in any district to be elected by voters of the whole county
  provenance: *id001
- id: city-of-boulder-2j
  kind: measure
  group: measures
  district_id: city-boulder
  title: City of Boulder Ballot Issue 2J
  ballot_text:
    text: 'RESIDENTIAL VACANCY EXCISE TAX (TABOR) SHALL THE CITY OF BOULDER TAXES BE INCREASED $6,000,000 ANNUALLY
      (WHICH AMOUNT REPRESENTS ESTIMATED REVENUES IN 2028, THE FIRST FULL FISCAL YEAR OF COLLECTION), AND BY SUCH
      AMOUNTS RAISED ANNUALLY THEREAFTER, BY IMPOSING A $4,000 TAX ON VACANT HOMES THAT ARE OCCUPIED FOR 183 DAYS
      OR LESS PER YEAR, WITH SUCH AMOUNT NEVER FALLING BELOW $4,000 BUT INCREASING ANNUALLY IN ACCORDANCE WITH THE
      DENVER-AURORA-LAKEWOOD CONSUMER PRICE INDEX UP TO, BUT NEVER EXCEEDING $7,000, WITH THE REVENUE FROM SUCH
      TAX TO BE USED FOR THE PURPOSE OF SUPPORTING CITY SERVICES, INCLUDING: POLICE AND FIRE PROTECTION; PARKS AND
      RECREATION; TRANSPORTATION AND MAINTENANCE; AND OTHER GENERAL SERVICES IMPORTANT TO THE QUALITY OF LIFE IN
      THE CITY; AND SHALL THE REVENUES FROM SUCH TAXES AND ANY RELATED EARNINGS BE COLLECTED, RETAINED, AND SPENT
      AS A VOTER-APPROVED REVENUE CHANGE WITHOUT LIMITATION AND AN EXCEPTION TO THE REVENUE AND SPENDING LIMITS
      OF ARTICLE X, SECTION 20 OF THE COLORADO CONSTITUTION?'
    source: https://assets.bouldercounty.gov/wp-content/uploads/2026/09/Boulder-County-2026-General-Sample-Ballot.pdf
  provenance: *id001
- id: city-of-boulder-2k
  kind: measure
  group: measures
  district_id: city-boulder
  title: City of Boulder Ballot Issue 2K
  ballot_text:
    text: 'RECREATION AND SAFETY BOND (TABOR) SHALL CITY OF BOULDER DEBT BE INCREASED UP TO $400,000,000, WITH A
      MAXIMUM REPAYMENT COST UP TO $650,000,000, AND SHALL CITY TAXES BE INCREASED UP TO $32,500,000 ANNUALLY FOR
      THE PURPOSE OF FINANCING THE CONSTRUCTION, RENOVATION, OR REPLACEMENT OF COMMUNITY RECREATION, SAFETY INFRASTRUCTURE,
      AND OTHER CAPITAL PROJECTS, SUCH AS: I) THE SOUTH BOULDER RECREATION CENTER, INCLUDING A LAP POOL; II) THE
      NORTH BOULDER RECREATION CENTER, INCLUDING AQUATICS AMENITIES AND IMPROVEMENTS NEEDED TO CO-LOCATE WEST AGE
      WELL SENIOR CENTER; III) FIRE STATIONS (TO SUSTAIN EMERGENCY AND WILDFIRE RESPONSE CAPABILITIES); IV) A NEW
      PUBLIC SAFETY BUILDING FOR POLICE AND 911 SERVICES; V) PENFIELD TATE II MUNICIPAL BUILDING; AND VI) THE MUNICIPAL
      SERVICE CENTER (TO SUPPORT INFRASTRUCTURE SERVICES, SUCH AS SNOW REMOVAL, UTILITY MAINTENANCE, AND CITY STREET
      OPERATIONS); IN ORDER TO SUPPORT RECREATION, SAFETY, AND CRITICAL INFRASTRUCTURE NEEDS FOR COMMUNITY MEMBERS
      OF ALL AGES; THROUGH THE ISSUANCE AND PAYMENT OF GENERAL OBLIGATION DEBT, WITH SUCH DEBT CONTAINING SUCH TERMS,
      NOT INCONSISTENT HEREWITH, AS THE CITY COUNCIL MAY DETERMINE; AND IN CONNECTION THEREWITH, SHALL AD VALOREM
      PROPERTY TAXES BE LEVIED WITHOUT LIMITATION AS TO THE RATE, BUT NOT MORE THAN THE AMOUNTS LISTED ABOVE, TO
      GENERATE AN AMOUNT SUFFICIENT IN EACH YEAR TO PAY THE PRINCIPAL OF, PREMIUM, IF ANY, AND INTEREST ON SUCH
      DEBT OR ANY REFUNDING DEBT (OR TO CREATE A RESERVE FOR SUCH PAYMENT); AND SHALL THE PROCEEDS OF SUCH DEBT
      AND RESERVES AND THE REVENUES FROM SUCH TAXES AND ANY INVESTMENT INCOME EARNED FROM SUCH PROCEEDS AND REVENUES
      BE COLLECTED AND SPENT WITHOUT LIMITATION OR CONDITION AS A VOTER-APPROVED REVENUE CHANGE AND AN EXCEPTION
      TO THE LIMITS THAT WOULD OTHERWISE APPLY UNDER ARTICLE X, SECTION 20 OF THE COLORADO CONSTITUTION OR ANY OTHER
      LAW?'
    source: https://assets.bouldercounty.gov/wp-content/uploads/2026/09/Boulder-County-2026-General-Sample-Ballot.pdf
  provenance: *id001
- id: city-of-boulder-2l
  kind: measure
  group: measures
  district_id: city-boulder
  title: City of Boulder Ballot Question 2L
  ballot_text:
    text: Bargaining Rights Union Firefighters in City Charter Shall the City amend its charter by the addition
      of a new Sec. 73, "Collective Bargaining for Firefighters," as described in Ordinance 8761 which provides
      a charter guaranteed right for full-time fire department employees to bargain collectively over matters related
      to safety, wages, benefits, and all other terms and conditions employment, except those certain terms that
      are reserved to rights of management as defined in the proposed charter amendment, with impasse to be resolved
      through non-binding factfinding followed, if necessary, by a vote of the qualified electors of the City?
    source: https://assets.bouldercounty.gov/wp-content/uploads/2026/09/Boulder-County-2026-General-Sample-Ballot.pdf
  choices:
  - For the Measure
  - Against the Measure
  provenance: *id001
- id: city-of-boulder-2m
  kind: measure
  group: measures
  district_id: city-boulder
  title: City of Boulder Ballot Question 2M
  ballot_text:
    text: Debt Limit City Charter Language Change Shall Section 97 of the Boulder Home Rule Charter be amended pursuant
      to Ordinance 8762 to modify the City's debt limitation to be not more than three percent of the actual value
      of the taxable property within the City?
    source: https://assets.bouldercounty.gov/wp-content/uploads/2026/09/Boulder-County-2026-General-Sample-Ballot.pdf
  choices:
  - For the Measure
  - Against the Measure
  provenance: *id001
- id: city-of-lafayette-2a
  kind: measure
  group: measures
  district_id: city-lafayette
  title: City of Lafayette Ballot Issue 2A
  ballot_text:
    text: EXTENSION OF AN EXPIRING TAX FOR LAMONT DOES PARK WITHOUT IMPOSING A NEW TAX, SHALL THE CITY OF LAFAYETTE
      BE AUTHORIZED TO EXTEND AN EXPIRING PROPERTY TAX IN AN AMOUNT NOT TO EXCEED $713,000 ANNUALLY (TOTAL ANNUAL
      REVENUE COLLECTION FOR THE CITY), WHICH PROPERTY TAX INCREASE WAS APPROVED BY THE VOTERS IN 2014 AND IS SET
      TO EXPIRE IN DECEMBER 2026, SUCH TAX TO BE EXTENDED THROUGH DECEMBER 31, 2046, WITH SUCH REVENUE TO BE USED
      FOR CAPITAL IMPROVEMENTS TO, AND THE CONTINUED OPERATION AND MAINTENANCE OF, LAMONT DOES PARK AND RELATED
      FACILITIES, INCLUDING THE PAYMENT OF ANY ANNUALLY APPROPRIATED OBLIGATION FOR SUCH PURPOSES, AND FOR OTHER
      CITY PURPOSES RELATED THERETO, AND SHALL SUCH RESULTING REVENUE CONSTITUTE A VOTER APPROVED REVENUE AND/OR
      SPENDING CHANGE AND BE COLLECTED AND SPENT BY THE CITY WITHOUT REGARD TO ANY SPENDING, REVENUE RAISING OR
      OTHER LIMITATION CONTAINED WITHIN ARTICLE X, SECTION 20 OF THE COLORADO CONSTITUTION, OR ANY OTHER LAW?
    source: https://assets.bouldercounty.gov/wp-content/uploads/2026/09/Boulder-County-2026-General-Sample-Ballot.pdf
  provenance: *id001
- id: city-of-longmont-3a
  kind: measure
  group: measures
  district_id: city-longmont
  title: City of Longmont Ballot Issue 3A
  ballot_text:
    text: 'MAINTAIN AND INCREASE FIRE AND POLICE SERVICES VIA TAX INCREASES SHALL CITY OF LONGMONT TAXES BE INCREASED
      $19.5 MILLION ANNUALLY IN THE FIRST FULL YEAR AND BY WHATEVER ADDITIONAL AMOUNTS AS ARE GENERATED ANNUALLY
      IN EACH SUBSEQUENT YEAR FROM THE IMPOSITION OF AN ADDITIONAL MILL LEVY OF NOT TO EXCEED 2.44 MILLS (AS ADJUSTED)
      BEGINNING WITH TAX COLLECTION YEAR 2027 AND AN ADDITIONAL CITY SALES AND USE TAX IMPOSED AT A RATE OF 0.33%
      BEGINNING JANUARY 1, 2027, WITH THE PROCEEDS OF SUCH TAXES BEING USED EXCLUSIVELY TO MAINTAIN AND INCREASE
      THE LEVEL OF SERVICE FOR PUBLIC SAFETY IN THE CITY OF LONGMONT, INCLUDING, BUT NOT LIMITED TO PROVIDING FUNDS
      FOR: POLICE OFFICERS AND PERSONNEL FOR TRAFFIC ENFORCEMENT AND CRIMINAL INVESTIGATIONS AND PREVENTION; POLICE
      OFFICERS TO ENSURE SAFETY OF OFFICERS AND TO IMPROVE EMERGENCY RESPONSE; EMERGENCY DISPATCHERS FOR 911 RESPONSE;
      FIREFIGHTERS TO ENSURE SAFE AND SUFFICIENT RESPONSE TO EMERGENCIES; PERSONNEL TO SUPPORT EMERGENCY PUBLIC
      SAFETY RESPONDERS; AND PUBLIC SAFETY EQUIPMENT, VEHICLES AND FACILITIES TO ENSURE SAFETY; AND SHALL ORDINANCE
      O-2026-53 AUTHORIZING SUCH TAX INCREASES BE APPROVED, AND SHALL THE CITY BE AUTHORIZED TO INCREASE THE MILL
      LEVY AUTHORIZED BY THIS QUESTION BEGINNING IN TAX COLLECTION YEAR 2028 AND ANNUALLY THEREAFTER TO OFFSET ANY
      REVENUE REDUCTIONS CAUSED BY ANY CONSTITUTIONALLY OR STATUTORILY REQUIRED TAX CREDITS, PROPERTY TAX REFUNDS,
      ABATEMENTS, REDUCTIONS IN THE PERCENTAGE OF ACTUAL VALUATION USED TO DETERMINE ASSESSED VALUATION, OR REDUCTIONS
      IN THE ACTUAL VALUE AGAINST WHICH THE ASSESSMENT RATE IS APPLIED THAT ARE ENACTED AFTER THE DATE OF APPROVAL
      OF THIS BALLOT QUESTION OR ARE OTHERWISE SET FORTH IN C.R.S. §§ 29-1-1701, ET SEQ., OR C.R.S. §§ 39-1-101,
      ET SEQ., AND SHALL THE PROCEEDS OF SUCH TAXES AND INVESTMENT INCOME THEREON BE COLLECTED AND SPENT WITHOUT
      REGARD TO ANY LIMITATION CONTAINED WITHIN ARTICLE X, SECTION 20 OF THE COLORADO CONSTITUTION OR ANY OTHER
      LAW?'
    source: https://assets.bouldercounty.gov/wp-content/uploads/2026/09/Boulder-County-2026-General-Sample-Ballot.pdf
  provenance: *id001
- id: city-of-longmont-3b
  kind: measure
  group: measures
  district_id: city-longmont
  title: City of Longmont Ballot Question 3B
  ballot_text:
    text: Charter Amendment to Protect Open Space Lands Shall the City of Longmont Home Rule Charter be amended
      by revising section 13.2 to add open space to lands that cannot be sold or conveyed without voter approval,
      with exceptions for public roads, utilities, life-essential infrastructure, open space operations, and the
      sale or conveyance of structures on such lands?
    source: https://assets.bouldercounty.gov/wp-content/uploads/2026/09/Boulder-County-2026-General-Sample-Ballot.pdf
  provenance: *id001
- id: city-of-longmont-3c
  kind: measure
  group: measures
  district_id: city-longmont
  title: City of Longmont Ballot Question 3C
  ballot_text:
    text: Charter Amendment to Allow Ranked Choice Voting Methods Shall the City of Longmont Home Rule Charter be
      amended by adopting a new section 2.10 of the Charter to provide for the use of Ranked Choice Voting (ranked
      voting methods) where possible to elect future mayors and councilmembers of the City of Longmont starting
      in November 2029?
    source: https://assets.bouldercounty.gov/wp-content/uploads/2026/09/Boulder-County-2026-General-Sample-Ballot.pdf
  provenance: *id001
- id: city-of-longmont-3d
  kind: measure
  group: measures
  district_id: city-longmont
  title: City of Longmont Ballot Question 3D
  ballot_text:
    text: Charter Amendment to Adjust City Council Electoral Cycles Shall the City of Longmont Home Rule Charter
      be amended by amending section 3.6 of the Charter to realign the cycle on which members of the Longmont city
      council are elected so that the three councilmembers elected at-large are elected in one electoral cycle and
      the three councilmembers elected from wards are elected in another electoral cycle, with such electoral cycles
      alternating from then on, with such realignment contingent upon voter approval of the measure on the November
      3, 2026 City of Longmont ballot requiring the use of ranked choice voting to elect city council members when
      possible?
