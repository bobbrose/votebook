      AND ANY LAWFUL MUNICIPAL PURPOSE WITH (I) THE SALES TAX TO BE IMPOSED ON THE SALE OF TANGIBLE PERSONAL PROPERTY
      AND TAXABLE SERVICES, EXCEPT FOR FOOD FOR DOMESTIC CONSUMPTION AND SUCH OTHER CATEGORIES TO BE EXEMPT AS DETERMINED
      BY THE GOVERNING BODY OF THE MUNICIPALITY, AND (II) THE USE TAX TO BE IMPOSED ON THE PRIVILEGE OF STORING,
      USING, OR CONSUMING TANGIBLE PERSONAL PROPERTY IN NIWOT, INCLUDING CONSTRUCTION AND BUILDING MATERIALS, WITH
      ALL SUCH TAXES TO BE ESTABLISHED BY ORDINANCE OF THE GOVERNING BODY OF THE MUNICIPALITY PRIOR TO THE IMPOSITION
      OF THE SALES AND USE TAX AND CONSISTENT WITH THIS BALLOT MEASURE; AND SHALL NIWOT BE AUTHORIZED TO COLLECT,
