  district_id: city-louisville
  title: City of Louisville Ballot Issue 2B
  ballot_text:
    text: 'HISTORIC PRESERVATION TAX SHALL CITY OF LOUISVILLE TAXES BE INCREASED $1.5 MILLION IN 2029 AND THEN ANNUALLY
      THEREAFTER BY WHATEVER AMOUNTS ARE GENERATED FROM THE CONTINUATION OF THE CITY''S HISTORIC PRESERVATION SALES
      TAX OF 0.125% BEGINNING JANUARY 1, 2029, AND EXPIRING DECEMBER 31, 2038; WITH THE NET PROCEEDS OF SUCH SALES
      TAX, ALONG WITH THE CITY''S EXISTING 0.125% HISTORIC PRESERVATION USE TAX, TO BE UTILIZED FOR HISTORIC PRESERVATION
      PURPOSES AS ESTABLISHED BY BALLOT ISSUES APPROVED BY THE VOTERS IN 2008 AND 2017, AND, COMMENCING ON JANUARY
      1, 2027, SHALL THE CITY ALSO BE AUTHORIZED TO: (1) EXPEND ANY FUNDS FROM SUCH HISTORIC PRESERVATION TAX ON
      CITY PROGRAMS AND CAPITAL PROJECTS THAT PROMOTE AND PRESERVE THE CITY''S HISTORY AND CULTURAL HERITAGE, AND
      (2) INCREASE THE PORTION OF SUCH TAX ALLOCATED TO OPERATING AND MAINTAINING THE LOUISVILLE MUSEUM CAMPUS FROM
      20% TO 30% PER YEAR; AND SHALL THE CITY BE PERMITTED TO COLLECT, RETAIN AND EXPEND ALL REVENUES DERIVED FROM
      SUCH TAX AS A VOTER-APPROVED REVENUE CHANGE AND AN EXCEPTION TO LIMITS WHICH WOULD OTHERWISE APPLY UNDER ARTICLE
      X, SECTION 20 OF THE COLORADO CONSTITUTION OR ANY OTHER LAW?'
    source: https://assets.bouldercounty.gov/wp-content/uploads/2026/09/Boulder-County-2026-General-Sample-Ballot.pdf
  provenance: *id001
