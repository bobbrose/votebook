  title: Proposed Municipality of Niwot Ballot Issue 302
  ballot_text:
    text: AUTHORIZATION TO LEVY A SALES AND USE TAX SHALL NIWOT TAXES BE INCREASED BY $2,800,000 ANNUALLY IN THE
      FIRST FULL FISCAL YEAR, AND BY WHATEVER ADDITIONAL AMOUNTS ARE RAISED ANNUALLY THEREAFTER FROM A SALES AND
