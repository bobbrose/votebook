- id: estes-valley-fire-protection-district-6d
  kind: measure
  group: measures
  district_id: estes-valley-fire-protection-district
  title: Estes Valley Fire Protection District Ballot Issue 6D
  ballot_text:
    text: 'SHALL ESTES VALLEY FIRE PROTECTION DISTRICT TAXES BE INCREASED THREE MILLION FIVE HUNDRED THOUSAND ($3,500,000.00)
      DOLLARS ANNUALLY IN THE FIRST FULL FISCAL YEAR, AND BY SUCH AMOUNTS AS ARE RAISED ANNUALLY THEREAFTER BY THE
      IMPOSITION OF A SALES TAX BEGINNING JANUARY 1, 2027 NOT TO EXCEED 0.5% (50 CENTS ON EACH $100 DOLLARS), UPON
      EVERY TRANSACTION IN THE DISTRICT WHICH THE STATE IMPOSES A SALES TAX (EXCLUDING GROCERIES AND OTHER EXEMPT
      ITEMS); FUNDING FROM THE SALES TAX WILL BE USED FOR ANY LAWFUL PURPOSE INCLUDING, BUT NOT LIMITED TO: MAINTAINING
      WILDLAND FIREFIGHTING· CAPABILITIES TO INCLUDE SPECIALIZED AND/OR UPGRADED EQUIPMENT AND FIREFIGHTER TRAINING;
      MAINTAINING FIRE APPARATUS AND· EQUIPMENT TO EXTEND ITS USEFUL LIFE AND REPLACING AND/OR UPGRADING FIREFIGHTING
      VEHICLES, COMMUNICATION METHODS, SAFETY GEAR AND OTHER EQUIPMENT AND APPARATUS; FUNDING VOLUNTEER FIREFIGHTING·
      GENERAL AND SPECIALIZED TRAINING PROGRAMS, OPPORTUNITIES, AND OVERALL PROGRAM SUPPORT. AND SHALL ALL DISTRICT
      SALES TAX REVENUES AND THE EARNINGS FROM THE INVESTMENT OF SUCH REVENUES BE COLLECTED, RETAINED, AND SPENT
      AS A VOTER APPROVED REVENUE CHANGE NOTWITHSTANDING ANY REVENUE LIMITS PROVIDED BY LAW?'
    source: https://www.larimer.gov/clerk/elections
  provenance: *id001
- id: thompson-crossing-metropolitan-district-no-2-6e
  kind: measure
  group: measures
  district_id: thompson-crossing-metropolitan-district-no-2
  title: Thompson Crossing Metropolitan District No. 2 Ballot Issue 6E
  ballot_text:
    text: 'WITHOUT INCREASING THE DISTRICT''S AVERAGE PROPERTY TAX MILL LEVY FOR THE LAST 10 YEARS, SHALL THOMPSON
      CROSSING METROPOLITAN DISTRICT NO. 2 DEBT BE INCREASED UP TO $16 MILLION, WITH A MAXIMUM REPAYMENT COST OF
      UP TO $36 MILLION, FOR THE PURPOSE OF FINANCING PUBLIC IMPROVEMENTS, INCLUDING: A NEW MULTI-USE 10'' PAVED
      TRAIL· ALONG THE SOUTHERN BOUNDARY OF THE DISTRICT LOWERING THE INTEREST RATES ON· OBLIGATIONS FOR IMPROVEMENTS
      RELATED TO STREETS, WATER, SANITARY SEWER, STORM DRAINAGE, LANDSCAPING, PARKS AND RECREATION, SAFETY PROTECTION,
      TRANSPORTATION, AND SECURITY; SUCH DEBT TO CONSIST OF GENERAL OBLIGATION BONDS, WHICH BONDS SHALL BEAR INTEREST
      AT A MAXIMUM NET EFFECTIVE INTEREST RATE NOT TO EXCEED 5.25% PER ANNUM; SUCH BONDS TO BE PAYABLE FROM PROPERTY
      TAXES PREVIOUSLY APPROVED AT THE DISTRICT''S 2001 ELECTION; AND SHALL ALL SUCH REVENUES AND ANY EARNINGS FROM
      THE INVESTMENT OF SUCH REVENUES AND THE PROCEEDS OF THE BONDS CONSTITUTE A VOTER-APPROVED REVENUE CHANGE UNDER
      ARTICLE X, SECTION 20 OF THE COLORADO CONSTITUTION?'
    source: https://www.larimer.gov/clerk/elections
  provenance: *id001
- id: front-range-passenger-rail-district-7a
  kind: measure
  group: measures
  district_id: front-range-passenger-rail-district
  title: Front Range Passenger Rail District Ballot Issue 7A
  ballot_text:
    text: 'SHALL FRONT RANGE PASSENGER RAIL DISTRICT TAXES BE INCREASED $295,000,000 ANNUALLY AND BY WHATEVER AMOUNTS
      ARE RAISED ANNUALLY THEREAFTER, AND SHALL FRONT RANGE PASSENGER RAIL DISTRICT DEBT BE INCREASED $580,000,000,
      WITH A REPAYMENT COST OF $785,000,000; TO CONSTRUCT, OPERATE, AND MAINTAIN COLORADO CONNECTOR (COCO) PASSENGER
      RAIL SERVICE ON COLORADO''S FRONT RANGE AND CONNECT COMMUNITIES, INCLUDING PUEBLO, COLORADO SPRINGS, STERLING
      RANCH, LITTLETON, DENVER, WESTMINSTER, BROOMFIELD, LOUISVILLE, BOULDER, LONGMONT, LOVELAND, AND FORT COLLINS;
      IN ORDER TO: REMOVE VEHICLES FROM HIGHWAYS· AND INCREASE TRAVEL CAPACITY; CONNECT TRAVELERS TO· EMPLOYMENT
      CENTERS, COLLEGES, SPORTS ARENAS, AND ENTERTAINMENT HUBS ALONG THE FRONT RANGE; AND INVEST IN STATION AREA·
      IMPROVEMENTS AND LOCAL CONNECTIONS TO RAIL STATIONS; BY ESTABLISHING A 0.333% SALES AND USE TAX (EQUAL TO
      ONE THIRD OF A PENNY ON A $1 PURCHASE), WITH EXEMPTIONS PROVIDED UNDER COLORADO LAW, INCLUDING THOSE FOR GASOLINE,
      FOOD, RESIDENTIAL ELECTRICITY AND GAS, PRESCRIPTION DRUGS, AND MEDICAL SUPPLIES; AND TO RETAIN ALL SUCH REVENUES,
      PUBLIC AND PRIVATE CONTRIBUTIONS, AND ANY INVESTMENT INCOME ON REVENUES AND DEBT PROCEEDS, AS A VOTER-APPROVED
      REVENUE CHANGE UNDER SECTION 20 OF ARTICLE X OF THE COLORADO CONSTITUTION; AND REQUIRING THAT ALL SUCH DEDICATED
      REVENUES BE REVIEWED ANNUALLY BY AN INDEPENDENT AUDITOR AND A ROTATING GROUP OF CITIZEN TAXPAYERS WHO LIVE
      IN THE DISTRICT?'
    source: https://www.larimer.gov/clerk/elections
  provenance: *id001
- id: allenspark-fire-protection-district-7c
  kind: measure
  group: measures
  district_id: allenspark-fire-protection-district
  title: Allenspark Fire Protection District Ballot Issue 7C
  ballot_text:
    text: 'SHALL ALLENSPARK FIRE PROTECTION DISTRICT TAXES BE INCREASED BY UP TO $331,000 IN THE FIRST FISCAL YEAR
      (2027) AND BY SUCH AMOUNT AS MAY BE RAISED ANNUALLY THEREAFTER, BY INCREASING THE DISTRICT''S PROPERTY TAX
      RATE BY AN ADDITIONAL 5.3 MILLS, FOR THE PURPOSES OF PROVIDING FIRE PROTECTION AND EMERGENCY RESPONSE SERVICES,
      INCLUDING BUT NOT LIMITED TO: REBUILDING DEPLETED RESERVES IN· ORDER TO PRESERVE THE CURRENT LEVEL OF SERVICES
      FOR THE COMMUNITY, ADDRESS DEFERRED MAINTENANCE FOR OUR BUILDINGS AND GROUNDS, AND UPDATE AND REPLACE CRITICAL
      FIREFIGHTING AND MEDICAL EQUIPMENT (THE LAST MILL LEVY INCREASE WAS IN 2003). EXPAND STAFFING TO IMPROVE BOTH·
      FIRE AND MEDICAL OUTCOMES THROUGH FIRE MITIGATION, COMMUNITY OUTREACH AND EDUCATION. IMPROVING FIREFIGHTING·
      CAPABILITIES BY EXPANDING WATER RESOURCES TO INCREASE THE NUMBER OF DRY HYDRANTS AND INSTALLING WATER STORAGE
      TANKS AT KEY LOCATIONS THROUGHOUT THE DISTRICT. AND SHALL ALL REVENUE AND ANY EARNINGS ON THIS TAX CONSTITUTE
      A PERMANENT VOTER-APPROVED REVENUE CHANGE WITHIN THE MEANING OF ARTICLE X, SECTION 20 OF THE COLORADO CONSTITUTION
      AND AN EXCEPTION TO THE LIMITATIONS SET FORTH IN TITLE 29 OF THE COLORADO REVISED STATUTES, AND ANY OTHER
      LAW?'
    source: https://www.larimer.gov/clerk/elections
  provenance: *id001
- id: poudre-valley-fire-protection-district-7e
  kind: measure
  group: measures
  district_id: poudre-valley-fire-protection-district
  title: Poudre Valley Fire Protection District Ballot Issue 7E
  ballot_text:
    text: SHALL THE POUDRE VALLEY FIRE PROTECTION DISTRICT WAIVE THE 5.25% PROPERTY TAX LIMIT FOR ALL FUTURE PROPERTY
      TAX YEARS, WITHOUT INCREASING TAXES, TO ALLOW FOR THE DISTRICT TO RETAIN PROPERTY TAX REVENUE FOR THE PURPOSES
