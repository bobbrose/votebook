- id: larimer-county-1a
  kind: measure
  group: measures
  district_id: null
  title: Larimer County Ballot Issue 1A
  ballot_text:
    text: 'SHALL LARIMER COUNTY TAXES BE INCREASED BY UP TO $34 1/2 MILLION ANNUALLY (ESTIMATED FIRST YEAR INCREASE
      STARTING JANUARY 1, 2027), AND BY ANY ADDITIONAL AMOUNT GENERATED EACH YEAR THEREAFTER, TO FUND COUNTY PURPOSES
      INCLUDING: WILDFIRE, DRINKING WATER SOURCE· AREAS, AND NATURAL HAZARD RESILIENCE, INCLUDING PREVENTION, MITIGATION,
      PREPAREDNESS, RESPONSE, RECOVERY, WATERSHED PROTECTION, FOREST HEALTH, AND OTHER PROJECTS THAT REDUCE THE
      RISKS OR IMPACTS OF DISASTER; MAINTAIN, IMPROVE, AND CONSTRUCT· COUNTY BRIDGES, ROADS, PARKS, TRAILS, OPEN
      SPACES AND OTHER RECREATIONAL LANDS TO IMPROVE SAFETY, ACCESS AND QUALITY OF LIFE; AND COMMUNITY RESILIENCE
      AND PUBLIC· SAFETY, INCLUDING EMERGENCY SERVICES, WILDFIRE SUPPRESSION, ADMINISTRATION AND FUNDING OF PUBLIC
      BENEFITS, JUSTICE CENTER AND OTHER FACILITY IMPROVEMENTS, AND OTHER COUNTY PRIORITIES AND EMERGING COMMUNITY
      NEEDS; BY ESTABLISHING A 0.3% (30 CENTS ON $100 PURCHASE) COUNTYWIDE SALES AND USE TAX, EXCLUDING SALES OF
      FOOD FOR HOME CONSUMPTION, GASOLINE, DIAPERS, PRESCRIPTION DRUGS AND CERTAIN OTHER ITEMS EXEMPT BY LAW; WITH
      ALL REVENUE SUBJECT TO AN ANNUAL INDEPENDENT AUDIT; AND SHALL THE COUNTY BE AUTHORIZED TO COLLECT, RETAIN
      AND SPEND ALL REVENUES FROM THIS TAX WITHOUT LIMITATION BY ARTICLE X, SECTION 20 OF THE COLORADO CONSTITUTION
      (TABOR), ALL AS PROVIDED IN THE RESOLUTION REFERRING THIS BALLOT ISSUE?'
    source: https://www.larimer.gov/clerk/elections
  provenance: *id001
- id: town-of-wellington-2a
  kind: measure
  group: measures
  district_id: city-wellington
  title: Town of Wellington Ballot Issue 2A
  ballot_text:
    text: SHALL TOWN OF WELLINGTON TAXES BE INCREASED BY $995,000 ANNUALLY IN THE FISCAL YEAR BEGINNING JANUARY
      1, 2027, AND BY SUCH ADDITIONAL AMOUNTS AS MAY BE GENERATED ANNUALLY THEREAFTER, BY AN ADDITIONAL ONE-HALF
      PERCENT (0.50%) SALES AND USE TAX (WHICH WOULD COST 50 CENTS ON A $100 PURCHASE), TO FUND LAW ENFORCEMENT
      AND RELATED PUBLIC SAFETY SERVICES; AND TO THE EXTENT REVENUES EXCEED AMOUNTS BUDGETED FOR SUCH PURPOSES,
      OTHER LAWFUL MUNICIPAL OPERATING PURPOSES; AND SHALL THE TOWN BE AUTHORIZED TO COLLECT, RETAIN, AND SPEND
      THE PROCEEDS OF THE REVENUE FROM SUCH TAX AND ANY EARNINGS THEREON AS A VOTER-APPROVED REVENUE CHANGE AND
      AN EXCEPTION TO THE LIMITS ON REVENUE AND SPENDING UNDER ARTICLE X, SECTION 20 OF THE COLORADO CONSTITUTION
      OR ANY OTHER LAW?
    source: https://www.larimer.gov/clerk/elections
  provenance: *id001
- id: town-of-berthoud-3g
  kind: measure
  group: measures
  district_id: city-berthoud
  title: Town of Berthoud Ballot Issue 3G
  ballot_text:
    text: SHALL THE TOWN OF BERTHOUD DEBT BE INCREASED $28,000,000, WITH A MAXIMUM REPAYMENT COST OF UP TO $60,000,000,
      SUCH DEBT TO CONSIST OF SALES AND USE TAX REVENUE BONDS TO BE PAYABLE FROM ALL OR A PORTION OF THE TOWN'S
      SALES AND USE TAX (WITHOUT INCREASING TAXES) AND ISSUED SOLELY FOR PARKS AND RECREATION PURPOSES, INCLUDING
      BUT NOT LIMITED TO THE DESIGN, CONSTRUCTION, AND EQUIPMENT OF A COMMUNITY PARK SITE KNOWN AS MOUNTAIN VISTA
      PARK AND CONSISTING OF A COMBINATION OF BALLFIELDS, AQUATIC RECREATION FEATURES, AND RELATED IMPROVEMENTS;
      SUCH BONDS TO BE ISSUED, DATED AND SOLD AT SUCH TIMES, AND AT SUCH PRICES (AT, ABOVE OR BELOW PAR) AND CONTAINING
      SUCH TERMS, NOT INCONSISTENT HEREWITH, AS THE BOARD OF TRUSTEES MAY DETERMINE; AND SHALL THE EARNINGS ON THE
      INVESTMENT OF THE PROCEEDS OF SUCH BONDS (REGARDLESS OF AMOUNT) AND THE FUNDS USED FOR THE PAYMENT OF THE
      BONDS CONSTITUTE A VOTER-APPROVED REVENUE CHANGE AND AN EXCEPTION TO THE REVENUE AND SPENDING LIMITS OF ARTICLE
      X, SECTION 20 OF THE COLORADO CONSTITUTION OR ANY OTHER LAW?
    source: https://www.larimer.gov/clerk/elections
  provenance: *id001
- id: weld-county-school-district-no-re-5j-johnstown-milliken-5a
  kind: measure
  group: measures
  district_id: weld-county-school-district-no-re-5j-johnstown-milliken
  title: Weld County School District No. RE-5J (Johnstown Milliken) Ballot Issue 5A
  ballot_text:
    text: 'WITHOUT IMPOSING A NEW TAX, SHALL WELD COUNTY SCHOOL DISTRICT NO. RE-5J (JOHNSTOWN MILLIKEN) BE AUTHORIZED
      TO EXTEND THE TAX APPROVED BY THE DISTRICT''S VOTERS IN 2020 ($4 MILLION ANNUALLY), WHICH IS SET TO EXPIRE
      ON DECEMBER 31, 2030, TO BE USED FOR GENERAL FUND PURPOSES OF THE DISTRICT INCLUDING BUT NOT LIMITED TO: RETAIN
      AND ATTRACT HIGH QUALITY· TEACHERS AND STAFF; PROVIDE ADDITIONAL SAFETY,· SECURITY, AND MENTAL HEALTH PERSONNEL;
      EXPAND AUTHENTIC CAREER· EXPLORATION AND PREPARATION PROGRAMS; MAINTAIN EARLY CHILDHOOD· PROGRAMMING; SUCH
      REVENUES TO BE DEPOSITED IN THE GENERAL FUND AND USED FOR EDUCATIONAL PURPOSES PURSUANT TO SECTION 22-54-108,
      C.R.S.; AND SHALL THE REVENUES FROM SUCH TAXES AND ANY EARNINGS FROM THE INVESTMENT OF SUCH REVENUES BE COLLECTED
      AND SPENT AS A VOTER APPROVED REVENUE CHANGE UNDER ARTICLE X, SECTION 20 OF THE COLORADO CONSTITUTION AND
      ANY OTHER LAW?'
    source: https://www.larimer.gov/clerk/elections
  provenance: *id001
- id: stanley-heights-public-improvement-district-no-81-6a
  kind: measure
  group: measures
  district_id: stanley-heights-public-improvement-district-no-81
  title: Stanley Heights Public Improvement District No. 81 Ballot Issue 6A
  ballot_text:
    text: SHALL TAXES BE INCREASED $48,000.00 ANNUALLY (IN THE FIRST YEAR) OR SUCH GREATER AMOUNT AS IS RAISED IN
      SUBSEQUENT YEARS WITHIN THE BOUNDARIES OF THE PROPOSED STANLEY HEIGHTS PUBLIC IMPROVEMENT DISTRICT NO. 81
      BY THE IMPOSITION OF AD VALOREM PROPERTY TAXES AT A MILL LEVY RATE NOT TO EXCEED 13.791 MILLS, THE REVENUES
      OF WHICH WILL BE COLLECTED BEGINNING JANUARY 1, 2027 AND EACH YEAR THEREAFTER, SUCH REVENUES TO BE USED FOR
      THE IMPROVEMENT AND MAINTENANCE OF ROADS AS REQUESTED IN THE PETITION FOR CREATION OF THE DISTRICT AND FOR
      THE GENERAL OPERATING EXPENSES; SHALL STANLEY HEIGHTS PUBLIC IMPROVEMENT DISTRICT NO. 81 BE CREATED; AND SHALL
      THE PROCEEDS OF SUCH TAXES, THE SPECIFIC OWNERSHIP TAXES RECEIVED BY THE DISTRICT AND INVESTMENT EARNING ON
      BOTH CONSTITUTE VOTER APPROVED REVENUE AND/OR SPENDING CHANGES AND BE COLLECTED AND SPENT BY THE DISTRICT
      WITHOUT REGARD TO ANY SPENDING, REVENUE RAISING OR OTHER LIMITATION CONTAINED WITHIN ARTICLE X, SECTION 20
      OF THE COLORADO CONSTITUTION; AND SHALL THE DISTRICT BE AUTHORIZED TO COLLECT AND EXPEND FROM ITS MILL LEVY
      ANY SUCH AMOUNT WHICH IS MORE THAN THE AMOUNT WHICH WOULD OTHERWISE BE PERMITTED UNDER THE 5.5% LIMIT IMPOSED
      BY SECTION 29-1-301, COLORADO REVISED STATUTES IN 2027 AND EACH YEAR THEREAFTER?
    source: https://www.larimer.gov/clerk/elections
  provenance: *id001
