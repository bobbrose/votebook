[project]
name = "ballot-explorer-pipeline"
version = "0.1.0"
description = "Data pipeline for the Colorado Ballot Explorer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "shapely>=2.0",
    "pyshp>=2.3",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
